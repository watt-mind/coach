# Dedicated E2E stack — isolated from local dev (Postgres 5439 / Redis 6379).
# Parallel-safe: no fixed container_names; project name and host ports are
# parameterized so multiple stacks can run side by side on one Docker daemon.
#   - Project name: E2E_PROJECT (package.json scripts pass -p ${E2E_PROJECT:-coach-e2e})
#   - Ports: E2E_PORT (app, default 3199), E2E_PG_PORT (default 5440),
#     E2E_REDIS_PORT (default 6389). The app listens on E2E_PORT inside the
#     container too, so browser-facing URLs (auth origin, site URL) stay
#     consistent between host and container.
#   - App image: E2E_APP_IMAGE (default coach-e2e-app:local). CI exports a
#     content-hashed tag so concurrent runs never race on the :local tag.
# Usage:
#   pnpm e2e:setup     # infra + migrate/seed + app
#   pnpm e2e:up:infra  # Postgres + Redis only (host-run app via pnpm e2e:app:host)
#   pnpm e2e:down

services:
  postgres-e2e:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: watts
      POSTGRES_PASSWORD: password
      POSTGRES_DB: coach_e2e
    ports:
      - '${E2E_PG_PORT:-5440}:5432'
    volumes:
      - postgres_e2e_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U watts -d coach_e2e']
      interval: 5s
      timeout: 5s
      retries: 10

  redis-e2e:
    image: docker.dragonflydb.io/dragonflydb/dragonfly
    ulimits:
      memlock: -1
    command:
      [
        '--default_lua_flags=allow-undeclared-keys',
        '--requirepass=dragonfly',
        '--proactor_threads=2',
        '--maxmemory=512mb'
      ]
    ports:
      - '${E2E_REDIS_PORT:-6389}:6379'

  app-e2e:
    image: '${E2E_APP_IMAGE:-coach-e2e-app:local}'
    build:
      context: .
      dockerfile: Dockerfile.e2e
      cache_from:
        - coach-e2e-app:local
    ports:
      - '${E2E_PORT:-3199}:${E2E_PORT:-3199}'
    environment:
      # In-compose service hostnames (override host-oriented .env.e2e values).
      # Quote URLs: unquoted `&` is a YAML anchor.
      DATABASE_URL: 'postgresql://watts:password@postgres-e2e:5432/coach_e2e?connection_limit=5&pool_timeout=10&connect_timeout=10'
      REDIS_URL: 'redis://:dragonfly@redis-e2e:6379/0'
      E2E_MODE: 'true'
      TASK_QUEUE_DRIVER: redis
      MOCK_LLM_RESPONSES: 'true'
      NODE_ENV: production
      HOST: 0.0.0.0
      NITRO_HOST: 0.0.0.0
      PORT: '${E2E_PORT:-3199}'
      NEXTAUTH_URL: 'http://127.0.0.1:${E2E_PORT:-3199}/api/auth'
      NEXTAUTH_SECRET: e2e-test-auth-secret-change-me-min-32-chars
      NUXT_AUTH_SECRET: e2e-test-auth-secret-change-me-min-32-chars
      NUXT_AUTH_ORIGIN: 'http://127.0.0.1:${E2E_PORT:-3199}/api/auth'
      AUTH_ORIGIN: 'http://127.0.0.1:${E2E_PORT:-3199}/api/auth'
      AUTH_SECRET: e2e-test-auth-secret-change-me-min-32-chars
      NUXT_PUBLIC_SITE_URL: 'http://127.0.0.1:${E2E_PORT:-3199}/'
      DISABLE_EMAILS: 'true'
      TOLGEE_API_ENABLED: 'false'
      NUXT_PUBLIC_SUBSCRIPTIONS_ENABLED: 'true'
      CHAT_TURN_RUNNER_ENABLED: 'false'
      AUTH_BYPASS_USER: ''
      AUTH_BYPASS_NAME: ''
      GOOGLE_CLIENT_ID: e2e-placeholder
      GOOGLE_CLIENT_SECRET: e2e-placeholder
      STRAVA_CLIENT_ID: e2e-placeholder
      STRAVA_CLIENT_SECRET: e2e-placeholder
      INTERVALS_CLIENT_ID: e2e-placeholder
      INTERVALS_CLIENT_SECRET: e2e-placeholder
      STRIPE_SECRET_KEY: sk_test_e2e_placeholder
      NUXT_STRIPE_SECRET_KEY: sk_test_e2e_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_e2e_placeholder
      NUXT_STRIPE_WEBHOOK_SECRET: whsec_e2e_placeholder
    depends_on:
      postgres-e2e:
        condition: service_healthy
      redis-e2e:
        condition: service_started
      worker-e2e:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:${E2E_PORT:-3199}/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

  worker-e2e:
    image: '${E2E_APP_IMAGE:-coach-e2e-app:local}'
    # Bypass `pnpm run` — the runner image has node_modules but may omit lockfile/
    # workspace metadata. pnpm 11 then tries to repair deps and aborts in non-TTY CI
    # with ERR_PNPM_ABORTED_REMOVE_MODULES_DIR_NO_TTY before the worker starts.
    command: ['./node_modules/.bin/tsx', 'cli/worker/index.ts', 'start']
    environment:
      DATABASE_URL: 'postgresql://watts:password@postgres-e2e:5432/coach_e2e?connection_limit=5&pool_timeout=10&connect_timeout=10'
      REDIS_URL: 'redis://:dragonfly@redis-e2e:6379/0'
      E2E_MODE: 'true'
      TASK_QUEUE_DRIVER: redis
      MOCK_LLM_RESPONSES: 'true'
      DISABLE_EMAILS: 'true'
      NODE_ENV: production
      CI: 'true'
      # Set directly (matches dev:worker/cw:worker/run.sh) so ensure-heap.ts's
      # relaunch path — which re-execs with an elevated heap limit — is a no-op here.
      NODE_OPTIONS: '--max-old-space-size=8192'
      CW_WORKER_HEALTH_PORT: '8081'
      NUXT_PUBLIC_SITE_URL: 'http://127.0.0.1:${E2E_PORT:-3199}/'
      NUXT_PUBLIC_SUBSCRIPTIONS_ENABLED: 'true'
      STRIPE_SECRET_KEY: sk_test_e2e_placeholder
      NUXT_STRIPE_SECRET_KEY: sk_test_e2e_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_e2e_placeholder
      NUXT_STRIPE_WEBHOOK_SECRET: whsec_e2e_placeholder
    depends_on:
      postgres-e2e:
        condition: service_healthy
      redis-e2e:
        condition: service_started
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8081/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

volumes:
  postgres_e2e_data:
