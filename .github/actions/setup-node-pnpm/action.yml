name: Setup Node + pnpm
description: >
  Install pnpm and Node, install dependencies using the local pnpm store and
  (optionally) run `nuxt prepare`. Shared by the CI and E2E workflows so the
  setup lives in one place.

inputs:
  nuxt-prepare:
    description: Run `pnpm exec nuxt prepare` after installing dependencies.
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      with:
        # Install into the job's own RUNNER_TEMP, never the action's default
        # `~/setup-pnpm`. On the self-hosted hosts several runner registrations
        # share one `$HOME`, so the default path is shared state: two jobs on the
        # same host raced to self-update pnpm into it and both died before
        # running anything (`ENOTEMPTY: rmdir '~/setup-pnpm'`). RUNNER_TEMP is
        # allocated per job, so jobs cannot collide here. See CW-630.
        dest: ${{ runner.temp }}/setup-pnpm

    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
      with:
        node-version-file: '.nvmrc'
        package-manager-cache: false
        # Keep the pnpm store local to the runner. Remote Actions cache restore
        # and save are intentionally disabled (CW-626).

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Prepare Nuxt
      if: inputs.nuxt-prepare == 'true'
      shell: bash
      run: pnpm exec nuxt prepare
