version: 2
updates:
  # Maintain dependencies for npm / pnpm package ecosystem
  - package-ecosystem: 'npm'
    directory: '/'
    target-branch: 'develop'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
    # One PR per week for all minor/patch bumps instead of one PR (and one full
    # CI run on the shared runner pool) per package. Majors stay separate so a
    # breaking upgrade can be reviewed — and reverted — on its own.
    groups:
      npm-minor-patch:
        update-types: ['minor', 'patch']
    labels:
      - 'dependencies'
      - 'security'

  # Maintain updates for GitHub Actions workflows
  - package-ecosystem: 'github-actions'
    directory: '/'
    target-branch: 'develop'
    schedule:
      interval: 'monthly'
    open-pull-requests-limit: 3
    groups:
      github-actions:
        patterns: ['*']
    labels:
      - 'ci'
      - 'dependencies'
