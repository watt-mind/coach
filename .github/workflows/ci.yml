name: CI

on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.gitignore'
      - 'LICENSE'
  # Called by deploy.yml so master/develop pushes gate the Dokploy release on
  # lint/typecheck/tests. Do not add a `push` trigger back — that would double-run CI.
  workflow_call:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

concurrency:
  # PR runs supersede each other; workflow_call runs are keyed per-commit so they
  # never queue behind (or deadlock with) the calling deploy workflow's group.
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Job names `Typecheck`, `Lint` and `Unit tests` are required status checks on
# develop/master branch protection — do not rename them.
#
# Runner pool: the persistent `watt-mind-runner-*` runners (`shadow` + `runner`
# labels), not the ephemeral `linux-container` pool. That pool is shared with
# other repos and scales from zero, so a job waited ~100s for a runner even when
# the pool was idle and a median of ~17 min under load, for ~4 min of work; these
# runners pick a job up in ~2s. See CW-917 for the measurements before moving
# these jobs again.
#
# Keep the job count low all the same: anything that takes seconds rides along
# in an existing job instead of occupying a runner of its own.
jobs:
  typecheck:
    name: Typecheck
    runs-on: [self-hosted, shadow, runner]
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node + pnpm
        uses: ./.github/actions/setup-node-pnpm

      # `nuxt typecheck` runs `nuxt prepare` itself.
      - name: Run Nuxt typecheck
        run: pnpm typecheck

  lint:
    name: Lint
    runs-on: [self-hosted, shadow, runner]
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node + pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          nuxt-prepare: 'true'

      - name: Run ESLint
        run: pnpm lint

      # No pnpm store upload here. On these runners an uncached `pnpm install`
      # takes ~10s, less than restoring the ~440 MB store archive did. The store
      # sits under each runner's own RUNNER_TEMP and the cache version includes
      # that path, so saving would upload one archive per runner per PR into a
      # repository cache that is already over its 10 GB limit.

  unit-tests:
    name: Unit tests
    runs-on: [self-hosted, shadow, runner]
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node + pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          nuxt-prepare: 'true'

      - name: Run unit tests
        id: unit
        run: pnpm test:unit

      # Previously its own job: ~6s of tests behind ~70s of setup on a separate
      # runner slot. Still runs when unit tests fail, so both results show up.
      - name: Run MCP server tests
        if: ${{ !cancelled() && (steps.unit.outcome == 'success' || steps.unit.outcome == 'failure') }}
        run: pnpm test:mcp
