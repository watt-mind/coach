name: CI

on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.gitignore'
      - 'LICENSE'
  # Called by deploy.yml so master/develop pushes gate the Dokploy release on
  # lint/typecheck/tests. Do not add a `push` trigger back — that would double-run CI.
  workflow_call:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

concurrency:
  # PR runs supersede each other; workflow_call runs are keyed per-commit so they
  # never queue behind (or deadlock with) the calling deploy workflow's group.
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Job names `Typecheck`, `Lint` and `Unit tests` are required status checks on
# develop/master branch protection — do not rename them.
#
# Self-hosted runner slots are the bottleneck (PR runs spend more time queued
# than executing), so keep the job count low: anything that takes seconds rides
# along in an existing job instead of paying ~1 min of setup on its own runner.
jobs:
  typecheck:
    name: Typecheck
    runs-on: [self-hosted, linux-container]
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node + pnpm
        uses: ./.github/actions/setup-node-pnpm

      # `nuxt typecheck` runs `nuxt prepare` itself.
      - name: Run Nuxt typecheck
        run: pnpm typecheck

  lint:
    name: Lint
    runs-on: [self-hosted, linux-container]
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node + pnpm
        id: setup
        uses: ./.github/actions/setup-node-pnpm
        with:
          nuxt-prepare: 'true'

      - name: Run ESLint
        run: pnpm lint

      # The only job that saves the pnpm store (it is the shortest one, so the
      # upload stays off the critical path). Saving from every job made all but
      # one fail the cache reservation after ~20s of compression each.
      - name: Prune pnpm store
        if: steps.setup.outputs.cache-hit != 'true'
        run: pnpm store prune

      - name: Save pnpm store
        if: steps.setup.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ steps.setup.outputs.store-path }}
          key: ${{ steps.setup.outputs.cache-key }}

  unit-tests:
    name: Unit tests
    runs-on: [self-hosted, linux-container]
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node + pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          nuxt-prepare: 'true'

      - name: Run unit tests
        id: unit
        run: pnpm test:unit

      # Previously its own job: ~6s of tests behind ~70s of setup on a separate
      # runner slot. Still runs when unit tests fail, so both results show up.
      - name: Run MCP server tests
        if: ${{ !cancelled() && (steps.unit.outcome == 'success' || steps.unit.outcome == 'failure') }}
        run: pnpm test:mcp
