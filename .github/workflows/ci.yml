name: CI

on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.gitignore'
      - 'LICENSE'
  # Called by deploy.yml so master/develop pushes gate the Dokploy release on
  # lint/typecheck/tests. Do not add a `push` trigger back — that would double-run CI.
  workflow_call:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

concurrency:
  # PR runs supersede each other; workflow_call runs are keyed per-commit so they
  # never queue behind (or deadlock with) the calling deploy workflow's group.
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Job names `Typecheck`, `Lint` and `Unit tests` are required status checks on
# develop/master branch protection — do not rename them.
#
# Runner pool: GitHub-hosted `ubuntu-latest` (free for this public repository).
# Neither self-hosted pool fits these jobs:
# - `linux-container` is shared with other repos and scales from zero, so jobs
#   waited a median of ~17 min under load for ~4 min of work (CW-917).
# - The persistent `shadow` + `runner` host is shared too. A burst of PRs put
#   several vitest/vue-tsc jobs on it at once, starved it, and a timed-out vitest
#   kept running after its job was cancelled, taking every runner on the host
#   offline (CW-1034).
# A GitHub-hosted VM is fresh per job, so nothing outlives a cancelled job.
#
# Keep the job count low all the same: anything that takes seconds rides along
# in an existing job instead of occupying a runner of its own.
jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node + pnpm
        uses: ./.github/actions/setup-node-pnpm

      # `nuxt typecheck` runs `nuxt prepare` itself.
      - name: Run Nuxt typecheck
        run: pnpm typecheck

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node + pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          nuxt-prepare: 'true'

      - name: Run ESLint
        run: pnpm lint

      # No pnpm store upload here. Each job installs from scratch on a fresh VM;
      # the ~440 MB store archive would land in a repository cache that is
      # already over its 10 GB limit and get evicted before it paid off.

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node + pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          nuxt-prepare: 'true'

      - name: Run unit tests
        id: unit
        run: pnpm test:unit

      # Previously its own job: ~6s of tests behind ~70s of setup on a separate
      # runner slot. Still runs when unit tests fail, so both results show up.
      - name: Run MCP server tests
        if: ${{ !cancelled() && (steps.unit.outcome == 'success' || steps.unit.outcome == 'failure') }}
        run: pnpm test:mcp
