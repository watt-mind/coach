name: CI

on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.gitignore'
      - 'LICENSE'
  # Called by deploy.yml so master pushes gate the Docker build on lint/typecheck/tests
  # instead of racing it. Do not add a `push` trigger back — that would double-run CI.
  workflow_call:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

concurrency:
  # PR runs supersede each other; workflow_call runs are keyed per-commit so they
  # never queue behind (or deadlock with) the calling deploy workflow's group.
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  typecheck:
    name: Typecheck
    runs-on: [self-hosted, linux-container]
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          # Install into the job's own RUNNER_TEMP, never the action's default
          # `~/setup-pnpm`. On the self-hosted shadow host, several runner
          # registrations share one `$HOME`, so the default path is shared state:
          # two of this workflow's four jobs landing on the same host raced to
          # self-update pnpm into it and both died before running anything
          # (`ENOTEMPTY: rmdir '/home/hdkiller/setup-pnpm'` and
          # `self-installer exits with code 1`). RUNNER_TEMP is allocated per job
          # and cleaned between jobs, so two jobs cannot collide here regardless
          # of how the runners are registered. See CW-630.
          dest: ${{ runner.temp }}/setup-pnpm

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Nuxt typecheck
        run: pnpm typecheck

  lint:
    name: Lint
    runs-on: [self-hosted, linux-container]
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          # Install into the job's own RUNNER_TEMP, never the action's default
          # `~/setup-pnpm`. On the self-hosted shadow host, several runner
          # registrations share one `$HOME`, so the default path is shared state:
          # two of this workflow's four jobs landing on the same host raced to
          # self-update pnpm into it and both died before running anything
          # (`ENOTEMPTY: rmdir '/home/hdkiller/setup-pnpm'` and
          # `self-installer exits with code 1`). RUNNER_TEMP is allocated per job
          # and cleaned between jobs, so two jobs cannot collide here regardless
          # of how the runners are registered. See CW-630.
          dest: ${{ runner.temp }}/setup-pnpm

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare Nuxt
        run: pnpm exec nuxt prepare

      - name: Run ESLint
        run: pnpm lint

  unit-tests:
    name: Unit tests
    runs-on: [self-hosted, linux-container]
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          # Install into the job's own RUNNER_TEMP, never the action's default
          # `~/setup-pnpm`. On the self-hosted shadow host, several runner
          # registrations share one `$HOME`, so the default path is shared state:
          # two of this workflow's four jobs landing on the same host raced to
          # self-update pnpm into it and both died before running anything
          # (`ENOTEMPTY: rmdir '/home/hdkiller/setup-pnpm'` and
          # `self-installer exits with code 1`). RUNNER_TEMP is allocated per job
          # and cleaned between jobs, so two jobs cannot collide here regardless
          # of how the runners are registered. See CW-630.
          dest: ${{ runner.temp }}/setup-pnpm

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare Nuxt
        run: pnpm exec nuxt prepare

      - name: Run unit tests
        run: pnpm test:unit

  mcp-tests:
    name: MCP tests
    runs-on: [self-hosted, linux-container]
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          # Install into the job's own RUNNER_TEMP, never the action's default
          # `~/setup-pnpm`. On the self-hosted shadow host, several runner
          # registrations share one `$HOME`, so the default path is shared state:
          # two of this workflow's four jobs landing on the same host raced to
          # self-update pnpm into it and both died before running anything
          # (`ENOTEMPTY: rmdir '/home/hdkiller/setup-pnpm'` and
          # `self-installer exits with code 1`). RUNNER_TEMP is allocated per job
          # and cleaned between jobs, so two jobs cannot collide here regardless
          # of how the runners are registered. See CW-630.
          dest: ${{ runner.temp }}/setup-pnpm

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare Nuxt
        run: pnpm exec nuxt prepare

      - name: Run MCP server tests
        run: pnpm test:mcp
