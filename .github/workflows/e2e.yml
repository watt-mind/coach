name: E2E

# Runs on:
# 1. Manual trigger (workflow_dispatch) with options for ref, with_lighthouse, or lighthouse_only
# 2. Pull Requests targeting `master` (runs E2E + Lighthouse)
# 3. Pull Requests labeled with `run-e2e` or `run-lighthouse`
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to test (branch, tag, or SHA)
        required: true
        default: develop
        type: string
      with_lighthouse:
        description: Run Lighthouse CI performance audits alongside Playwright
        required: false
        default: false
        type: boolean
      lighthouse_only:
        description: Skip Playwright E2E tests and run ONLY Lighthouse CI
        required: false
        default: false
        type: boolean
  pull_request:
    types: [opened, synchronize, reopened, labeled]

concurrency:
  group: e2e-mac-mini
  cancel-in-progress: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  e2e:
    name: Playwright E2E
    runs-on: [self-hosted, e2e]
    timeout-minutes: 120
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.base_ref == 'master' ||
      contains(github.event.pull_request.labels.*.name, 'run-e2e') ||
      contains(github.event.pull_request.labels.*.name, 'run-lighthouse')

    env:
      DOCKER_BUILDKIT: '1'
      COMPOSE_DOCKER_CLI_BUILD: '1'
      PLAYWRIGHT_BROWSERS_PATH: '~/.cache/ms-playwright'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare Nuxt
        run: pnpm exec nuxt prepare

      - name: Prepare e2e env
        run: |
          cp .env.e2e.example .env.e2e

      - name: Free e2e ports / previous stack
        run: |
          pnpm e2e:down || true
          if lsof -tiTCP:3199 -sTCP:LISTEN >/dev/null 2>&1; then
            lsof -tiTCP:3199 -sTCP:LISTEN | xargs kill || true
            sleep 2
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Build and start Docker e2e stack
        run: pnpm e2e:setup

      - name: Dump e2e container logs on setup failure
        if: failure()
        run: |
          docker logs coach-worker-e2e 2>&1 || true
          docker logs coach-app-e2e 2>&1 || true
          docker compose --env-file .env.e2e -p coach-e2e -f docker-compose.e2e.yml ps || true

      - name: Cache Playwright Chromium
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            playwright-chromium-${{ runner.os }}-

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright
        if: ${{ !inputs.lighthouse_only }}
        run: pnpm test:e2e
        env:
          CI: true

      - name: Run Lighthouse CI
        if: |
          github.base_ref == 'master' ||
          inputs.with_lighthouse == true ||
          inputs.lighthouse_only == true ||
          contains(github.event.pull_request.labels.*.name, 'run-lighthouse')
        run: pnpm e2e:lighthouse
        env:
          CI: true
          E2E_BASE_URL: 'http://localhost:3199'

      - name: Upload Playwright report
        if: always() && !inputs.lighthouse_only
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Lighthouse report
        if: always() && (github.base_ref == 'master' || inputs.with_lighthouse == true || inputs.lighthouse_only == true || contains(github.event.pull_request.labels.*.name, 'run-lighthouse'))
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: lighthouserc-report-${{ github.run_id }}
          path: .lighthouseci/
          if-no-files-found: ignore
          retention-days: 14

      - name: Tear down e2e stack
        if: always()
        run: command -v pnpm >/dev/null 2>&1 && pnpm e2e:down || true
