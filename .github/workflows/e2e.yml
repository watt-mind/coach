name: E2E

# Runs on:
# 1. Manual trigger (workflow_dispatch) with options for ref, with_lighthouse, or lighthouse_only
# 2. Pull Requests targeting `master` (runs E2E + Lighthouse)
# 3. Pull Requests labeled with `run-e2e` or `run-lighthouse`
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to test (branch, tag, or SHA)
        required: true
        default: develop
        type: string
      with_lighthouse:
        description: Run Lighthouse CI performance audits alongside Playwright
        required: false
        default: false
        type: boolean
      lighthouse_only:
        description: Skip Playwright E2E tests and run ONLY Lighthouse CI
        required: false
        default: false
        type: boolean
  pull_request:
    types: [opened, synchronize, reopened, labeled]

# Per-PR only: a new push supersedes that PR's in-flight run. Runs for
# different PRs (and manual dispatches) execute in parallel — the stack is
# parallel-safe via per-run compose project names and ports (CW-666).
concurrency:
  group: e2e-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  e2e:
    name: Playwright E2E
    runs-on: [self-hosted, e2e]
    timeout-minutes: 120
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.base_ref == 'master' ||
      contains(github.event.pull_request.labels.*.name, 'run-e2e') ||
      contains(github.event.pull_request.labels.*.name, 'run-lighthouse')

    env:
      DOCKER_BUILDKIT: '1'
      COMPOSE_DOCKER_CLI_BUILD: '1'
      PLAYWRIGHT_BROWSERS_PATH: '~/.cache/ms-playwright'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare Nuxt
        run: pnpm exec nuxt prepare

      # Per-run compose project + host ports so concurrent runs on one Docker
      # daemon never collide (CW-666). Ports land in .env.e2e because Playwright
      # and prepare-db load it with dotenv override:true (it beats process env),
      # and compose interpolates it via --env-file.
      - name: Prepare e2e env (per-run project + ports)
        run: |
          E2E_PROJECT="coach-e2e-${GITHUB_RUN_ID}"
          PORT_BASE=$(( 10000 + (GITHUB_RUN_ID % 5000) * 4 ))
          E2E_PORT="$PORT_BASE"
          E2E_PG_PORT=$(( PORT_BASE + 1 ))
          E2E_REDIS_PORT=$(( PORT_BASE + 2 ))
          sed -e "s/3199/${E2E_PORT}/g" \
              -e "s/5440/${E2E_PG_PORT}/g" \
              -e "s/6389/${E2E_REDIS_PORT}/g" \
              .env.e2e.example > .env.e2e
          {
            echo ""
            echo "# Per-run host ports for docker-compose.e2e.yml interpolation (CI)"
            echo "E2E_PG_PORT=${E2E_PG_PORT}"
            echo "E2E_REDIS_PORT=${E2E_REDIS_PORT}"
          } >> .env.e2e
          {
            echo "E2E_PROJECT=${E2E_PROJECT}"
            echo "E2E_PORT=${E2E_PORT}"
            echo "E2E_PG_PORT=${E2E_PG_PORT}"
            echo "E2E_REDIS_PORT=${E2E_REDIS_PORT}"
            echo "E2E_BASE_URL=http://127.0.0.1:${E2E_PORT}"
          } >> "$GITHUB_ENV"
          echo "Per-run stack: project=${E2E_PROJECT} app=${E2E_PORT} pg=${E2E_PG_PORT} redis=${E2E_REDIS_PORT}"

      # Only this run's project — never kill listeners or other projects' stacks;
      # sibling runs may be mid-flight on the same host.
      - name: Pre-clean this run's stack
        run: pnpm e2e:down || true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Build and start Docker e2e stack
        run: pnpm e2e:setup

      - name: Dump e2e container logs on setup failure
        if: failure()
        run: |
          docker compose --env-file .env.e2e -p "$E2E_PROJECT" -f docker-compose.e2e.yml logs worker-e2e 2>&1 || true
          docker compose --env-file .env.e2e -p "$E2E_PROJECT" -f docker-compose.e2e.yml logs app-e2e 2>&1 || true
          docker compose --env-file .env.e2e -p "$E2E_PROJECT" -f docker-compose.e2e.yml ps || true

      - name: Cache Playwright Chromium
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            playwright-chromium-${{ runner.os }}-

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright
        if: ${{ !inputs.lighthouse_only }}
        run: pnpm test:e2e
        env:
          CI: true

      - name: Run Lighthouse CI
        if: |
          github.base_ref == 'master' ||
          inputs.with_lighthouse == true ||
          inputs.lighthouse_only == true ||
          contains(github.event.pull_request.labels.*.name, 'run-lighthouse')
        # E2E_BASE_URL comes from the per-run env (GITHUB_ENV) set in
        # "Prepare e2e env" — lighthouserc.cjs reads it from process env.
        run: pnpm e2e:lighthouse
        env:
          CI: true

      - name: Upload Playwright report
        if: always() && !inputs.lighthouse_only
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Lighthouse report
        if: always() && (github.base_ref == 'master' || inputs.with_lighthouse == true || inputs.lighthouse_only == true || contains(github.event.pull_request.labels.*.name, 'run-lighthouse'))
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: lighthouserc-report-${{ github.run_id }}
          path: .lighthouseci/
          if-no-files-found: ignore
          retention-days: 14

      # down -v: remove this run's containers, networks, AND volumes — per-run
      # projects would otherwise leak a postgres volume per run.
      - name: Tear down e2e stack
        if: always()
        run: command -v pnpm >/dev/null 2>&1 && pnpm e2e:down:wipe || true
