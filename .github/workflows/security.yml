name: Security Analysis

on:
  push:
    branches: ['master', 'develop']
  pull_request:
    branches: ['develop']
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.gitignore'
      - 'LICENSE'
  schedule:
    - cron: '0 4 * * 1'

permissions:
  contents: read
  security-events: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

concurrency:
  # A new push to a PR supersedes its in-flight scan (previously every push
  # queued another full CodeQL run on the shared runner pool). Branch pushes and
  # the weekly schedule are never cancelled.
  group: security-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: CodeQL Security Scan
    # Dependabot PRs only bump package.json / pnpm-lock.yaml / action pins —
    # nothing CodeQL's JS/TS source analysis looks at — so skip them instead of
    # burning a runner slot per bump. The post-merge push scan still covers them.
    if: github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: [self-hosted, linux-container]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        language: ['javascript-typescript']

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
          # The shared host has 62 GB RAM / 32 CPUs, but each runner is capped
          # at 14 GB. Keep CodeQL below the runner cgroup instead of allowing
          # host-level auto-detection to request ~60 GB and 32 threads.
          ram: 8192
          threads: 4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          category: '/language:${{matrix.language}}'
