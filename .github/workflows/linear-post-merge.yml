name: Linear Auto Close on Merge

on:
  pull_request:
    types: [closed]

jobs:
  close-linear-issue:
    if: github.event.pull_request.merged == true
    runs-on: [self-hosted, linux-container]
    steps:
      - name: Extract Linear Issue Key & Mark Done
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          python3 -c "
          import os, re, urllib.request, json

          token = os.getenv('LINEAR_API_KEY')
          if not token:
              print('No LINEAR_API_KEY configured in secrets, skipping.')
              exit(0)

          text = f\"{os.getenv('PR_TITLE', '')} {os.getenv('PR_BODY', '')} {os.getenv('PR_BRANCH', '')}\"
          keys = set(re.findall(r'\b(?:CW|CLNT|OPS|WM|LAB)-\d+\b', text))
          print(f'Found Linear issue keys: {keys}')

          for key in keys:
              query = '''
              query($key: String!) {
                issue(id: $key) {
                  id identifier team { states { nodes { id name } } }
                }
              }
              '''
              req = urllib.request.Request(
                  'https://api.linear.app/graphql',
                  headers={'Authorization': token, 'Content-Type': 'application/json'},
                  data=json.dumps({'query': query, 'variables': {'key': key}}).encode('utf-8')
              )
              try:
                  with urllib.request.urlopen(req) as resp:
                      data = json.loads(resp.read().decode('utf-8'))
                      issue = data.get('data', {}).get('issue')
                      if not issue:
                          print(f'Issue {key} not found.')
                          continue
                      done_state = next((s['id'] for s in issue['team']['states']['nodes'] if s['name'] == 'Done'), None)
                      if done_state:
                          update_query = '''
                          mutation($id: String!, $stateId: String!) {
                            issueUpdate(id: $id, input: { stateId: $stateId }) {
                              issue { identifier state { name } }
                            }
                          }
                          '''
                          u_req = urllib.request.Request(
                              'https://api.linear.app/graphql',
                              headers={'Authorization': token, 'Content-Type': 'application/json'},
                              data=json.dumps({'query': update_query, 'variables': {'id': issue['id'], 'stateId': done_state}}).encode('utf-8')
                          )
                          with urllib.request.urlopen(u_req) as u_resp:
                              print(f'Moved {key} state to Done!')
              except Exception as e:
                  print(f'Error updating {key}: {e}')
          "
