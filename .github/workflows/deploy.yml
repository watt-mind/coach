name: Build and Deploy to Dokploy

on:
  push:
    branches:
      - master
      - develop
  workflow_dispatch:

concurrency:
  # Never build two images for the same branch at once — they race on the `latest`
  # tag and on the shared :buildcache ref. Newer pushes queue instead of cancelling
  # so a half-pushed image is never left behind.
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # CI and the image build run in parallel. Only the release (moving the branch
  # tag + triggering Dokploy) is gated on CI, so a red commit is never deployed —
  # but the ~10 min Docker build no longer waits ~6 min for CI to finish first.
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    name: Build image
    # Pin to the `shadow` build pool (`watt-mind-shadow-1..4`) — NOT the generic
    # `[self-hosted, Linux]`, which also matches `watt-mind-lab-smoke-1..6`. Those
    # are 4 vCPU / 15 GB smoke-check boxes with no swap and no Docker cleanup; a
    # `nuxt build` there starves the host and hangs (CW-608, 2026-08-12: a ~5-min
    # build ran 45+ min on `lab-smoke-4` and never finished). Combined with the
    # `cancel-in-progress: false` concurrency group above, one such hang blocks
    # every subsequent deploy on the branch until someone cancels it by hand.
    # `docker` is not a sufficient label either — it matches lab-1/lab-2/web-1.
    # `shadow` matches the build pool exactly. Bare `self-hosted` would also match
    # `mac-mini`, which fails GHCR push with an anonymous-token 403.
    runs-on: [self-hosted, linux-vm]
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
      # docker/build-push-action otherwise uploads a `.dockerbuild` build record
      # as a workflow artifact on every deploy. Nothing reads them, and they
      # consume the same shared storage pool as packages (CW-711).
      DOCKER_BUILD_RECORD_UPLOAD: 'false'
      DOCKER_BUILD_SUMMARY: 'false'

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
        with:
          name: coach
          keep-state: true

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Only the immutable per-commit tag is pushed here. The branch tag
      # (`develop` / `master`) and `latest` — what Dokploy pulls — are added by
      # the release job once CI has passed.
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=long

      - name: Build and push Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          # Each attestation is an extra GHCR package version attached to the
          # tag, so buildx's defaults stored 3 versions per deploy instead of
          # 1. Nothing here consumes provenance or SBOM (CW-711).
          provenance: false
          sbom: false
          build-args: |
            COMMIT_SHA=${{ github.sha }}
            SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}
            SENTRY_ORG=watt-mind
            SENTRY_PROJECT=coach-watts-web
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache
          # zstd: gzip-compressing the mode=max cache took ~3 min ("preparing
          # build cache for export 179.8s") on every deploy. ignore-error: a
          # failed cache upload must not fail an otherwise good image push.
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache,mode=max,compression=zstd,ignore-error=true

  release:
    name: Build and Deploy
    needs: [ci, build]
    runs-on: [self-hosted, linux-vm]
    timeout-minutes: 15
    # NOTE (CW-129): this must be the environment that actually has
    # DOKPLOY_WEBHOOK_URL configured (Settings > Environments). Environment
    # secrets do not fall back to another environment by name, so renaming this
    # from `preview` requires provisioning the secret on the new environment
    # before merge, or this job fails at the "Trigger Dokploy Deployment" step.
    # `develop` deploys to `staging` (coach-dev), `master` deploys to `production`.
    environment: ${{ github.ref == 'refs/heads/master' && 'production' || 'staging' }}
    permissions:
      contents: read
      packages: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Registry-side retag of the image the build job pushed: no layers move.
      - name: Tag image for ${{ github.ref_name }}
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          SHA_TAG: sha-${{ github.sha }}
          BRANCH_TAG: ${{ github.ref_name }}
          IS_MASTER: ${{ github.ref == 'refs/heads/master' }}
        run: |
          set -euo pipefail
          TAGS=(-t "${IMAGE}:${BRANCH_TAG}")
          if [ "${IS_MASTER}" = "true" ]; then
            TAGS+=(-t "${IMAGE}:latest")
          fi
          docker buildx imagetools create "${TAGS[@]}" "${IMAGE}:${SHA_TAG}"
          docker buildx imagetools inspect "${IMAGE}:${BRANCH_TAG}" | head -n 5

      - name: Trigger Dokploy Deployment
        env:
          DOKPLOY_WEBHOOK: ${{ secrets.DOKPLOY_WEBHOOK_URL }}
        run: |
          set -uo pipefail
          # This used to warn and exit 0 when the secret was missing, which let a
          # misconfigured environment "succeed" while silently deploying nothing
          # (CW-129). GitHub environment secrets do not fall back to another
          # environment, so pointing this job at a different `environment:` (see
          # above) requires DOKPLOY_WEBHOOK_URL to be provisioned there too — fail
          # loudly instead of masking that as a no-op.
          if [ -z "${DOKPLOY_WEBHOOK:-}" ]; then
            echo "::error::DOKPLOY_WEBHOOK_URL is not set for this job's GitHub environment. Environment secrets are not provisioned — add DOKPLOY_WEBHOOK_URL under Settings > Environments before this workflow can deploy."
            exit 1
          fi

          RESPONSE_BODY=$(mktemp)
          HTTP_CODE=$(curl -sS -X POST \
            --retry 3 --retry-delay 5 --retry-connrefused \
            --connect-timeout 10 --max-time 60 \
            -o "${RESPONSE_BODY}" \
            -w '%{http_code}' \
            "${DOKPLOY_WEBHOOK}") || HTTP_CODE="000"

          # A non-2xx response used to pass silently: the image was pushed, nothing
          # was deployed, and the Discord notification still said "success".
          case "${HTTP_CODE}" in
            2??)
              echo "✅ Dokploy deployment triggered (HTTP ${HTTP_CODE})"
              ;;
            *)
              echo "::error::Dokploy webhook failed (HTTP ${HTTP_CODE}). Image was pushed to ghcr.io but the deployment was NOT triggered."
              head -c 2000 "${RESPONSE_BODY}" || true
              exit 1
              ;;
          esac

  notify:
    name: Notify
    needs: [ci, build, release]
    # Reports build and release outcomes. A CI-only failure skips the release
    # and was never notified before either, so it stays quiet here too.
    if: always() && needs.build.result != 'cancelled' && (needs.build.result == 'failure' || needs.release.result != 'skipped')
    runs-on: [self-hosted, linux-container]
    timeout-minutes: 5
    env:
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
      DEPLOY_STATUS: ${{ (needs.build.result == 'success' && needs.release.result == 'success') && 'success' || 'failure' }}
    steps:
      - name: Discord Notification
        uses: sarisia/actions-status-discord@eb045afee445dc055c18d3d90bd0f244fd062708 # v1
        if: env.DISCORD_WEBHOOK != ''
        with:
          webhook: ${{ env.DISCORD_WEBHOOK }}
          status: ${{ env.DEPLOY_STATUS }}
          title: 'Deploy Status - ${{ github.repository }}'
          description: |
            **Deploy:** ${{ env.DEPLOY_STATUS }}
            **Environment:** ${{ github.ref == 'refs/heads/master' && 'production' || 'staging' }}
            **Branch:** ${{ github.ref_name }}
            **Commit:** [${{ github.sha }}](${{ github.event.head_commit.url }})
          color: ${{ env.DEPLOY_STATUS == 'success' && '0x28a745' || '0xdc3545' }}

  # Trigger.dev deploy disabled — migrating off Trigger.dev.
  # Reusable workflow retained at .github/workflows/reusable-trigger-deploy.yml
  # until the migration is complete; do not re-enable without intent.
